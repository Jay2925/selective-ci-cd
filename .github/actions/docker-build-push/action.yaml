name: docker-build-push
description: Build & push image, scan, generate SBOM, output digest
inputs:
  context:      { required: true }
  image:        { required: true }  # ghcr.io/org/repo/<component>
outputs:
  digest:
    description: "Image digest"
    value: ${{ steps.meta.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        tags: ${{ inputs.image }}:${{ github.sha }}
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=image,push-by-digest=true,name=${{ inputs.image }}
    - id: meta
      shell: bash
      run: |
        # Resolve pushed digest for the image ref
        DIGEST=$(jq -r '.[0].digest' <(echo '${{ steps.build.outputs.metadata }}'))
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

    # Trivy CVE scan (fail only on CRITICAL, adjust as needed)
    - uses: aquasecurity/trivy-action@0.26.0
      with:
        image-ref: ${{ inputs.image }}@${{ steps.meta.outputs.digest }}
        exit-code: '1'
        severity: 'CRITICAL'
        ignore-unfixed: true

    # SBOM (Syft) attach as artifact
    - uses: anchore/sbom-action@v0
      with:
        image: ${{ inputs.image }}@${{ steps.meta.outputs.digest }}
        artifact-name: sbom-${{ inputs.image##*/ }}.spdx.json
