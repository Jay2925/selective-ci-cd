name: build-node
description: Build & test Node project (not used in current workflow, kept for extension)
inputs:
  workdir: { required: true }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ inputs.workdir }}/package-lock.json
    - shell: bash
      run: |
        cd "${{ inputs.workdir }}"
        npm ci
        npm test -- --ci --reporters=default --reporters=jest-junit --outputFile=junit.xml
        mkdir -p junit && mv junit.xml junit/results.xml
