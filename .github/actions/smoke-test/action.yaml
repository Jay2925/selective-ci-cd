name: smoke-test
description: Port-forward & hit /health (example; not auto-used)
inputs:
  namespace: { required: true }
  release:   { required: true }
  path:      { required: false, default: "/health" }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -e
        POD=$(kubectl -n "${{ inputs.namespace }}" get pod -l app=${{ inputs.release }} -o jsonpath='{.items[0].metadata.name}')
        kubectl -n "${{ inputs.namespace }}" port-forward "$POD" 18080:8080 >/tmp/pf.log 2>&1 &
        PF_PID=$!
        sleep 2
        curl -fsS "http://127.0.0.1:18080${{ inputs.path }}"
        kill $PF_PID || true
