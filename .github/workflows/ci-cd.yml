name: selective-ci-cd
on:
  pull_request: { branches: [ develop, main ] }
  push:
    branches: [ develop, main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write
  packages: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO_PREFIX: ghcr.io/${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.dc.outputs.components }}
      ids:        ${{ steps.dc.outputs.ids }}
      is_develop: ${{ startsWith(github.ref, 'refs/heads/develop') }}
      is_main:    ${{ startsWith(github.ref, 'refs/heads/main') }}
      is_tag:     ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y jq
      - uses: mikefarah/yq@v4.44.3
      - id: dc
        run: bash ci/detect_changes.sh
      - run: |
          echo "components: ${{ steps.dc.outputs.components }}"
          echo "ids:        ${{ steps.dc.outputs.ids }}"

  build_test:
    needs: detect
    if: ${{ needs.detect.outputs.ids != '[]' && needs.detect.outputs.ids != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        id: ${{ fromJson(needs.detect.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Extract component meta for this matrix item
      - id: meta
        run: |
          comp=$(echo '${{ needs.detect.outputs.components }}' | jq -r '.[] | select(.id=="${{ matrix.id }}")')
          echo "path=$(echo "$comp" | jq -r .path)"  >> "$GITHUB_OUTPUT"
          echo "type=$(echo "$comp" | jq -r .type)"  >> "$GITHUB_OUTPUT"
          echo "port=$(echo "$comp" | jq -r .port)"  >> "$GITHUB_OUTPUT"

      # Java build & test
      - name: Setup Java
        if: ${{ steps.meta.outputs.type == 'java' }}
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Cache Maven repo
        if: ${{ steps.meta.outputs.type == 'java' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles(format('{0}/pom.xml', steps.meta.outputs.path)) }}
          restore-keys: m2-${{ runner.os }}-
      - name: Build & Test (Maven)
        if: ${{ steps.meta.outputs.type == 'java' }}
        run: |
          cd "${{ steps.meta.outputs.path }}"
          mvn -B -DskipTests=false clean test package

      # Node build & test
      - name: Setup Node
        if: ${{ steps.meta.outputs.type == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ steps.meta.outputs.path }}/package-lock.json
      - name: Build & Test (Node)
        if: ${{ steps.meta.outputs.type == 'node' }}
        run: |
          cd "${{ steps.meta.outputs.path }}"
          npm ci
          npm test -- --ci --reporters=default --reporters=jest-junit --outputFile=junit.xml
          mkdir -p junit && mv junit.xml junit/results.xml

      # Python build & test
      - name: Setup Python
        if: ${{ steps.meta.outputs.type == 'python' }}
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cache pip
        if: ${{ steps.meta.outputs.type == 'python' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles(format('{0}/pyproject.toml', steps.meta.outputs.path)) }}
          restore-keys: pip-${{ runner.os }}-
      - name: Build & Test (pytest)
        if: ${{ steps.meta.outputs.type == 'python' }}
        run: |
          cd "${{ steps.meta.outputs.path }}"
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install -e ".[dev]" pytest pytest-junit
          pytest --junitxml=junit/results.xml

      # Publish JUnit summaries
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            monolith/target/surefire-reports/*.xml
            services/**/junit/*.xml

      # Docker build & push (GHCR), capture digest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.path }}
          push: true
          tags: ${{ env.IMAGE_REPO_PREFIX }}/${{ matrix.id }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push-by-digest=true,name=${{ env.IMAGE_REPO_PREFIX }}/${{ matrix.id }}
      - id: digest
        run: |
          echo "digest=$(jq -r '.[0].digest' <<< '${{ steps.build.outputs.metadata }}')" >> "$GITHUB_OUTPUT"

      # Expose digest to downstream (env file trick)
      - name: Save digest for later
        run: echo "${{ matrix.id }}=${{ steps.digest.outputs.digest }}" >> $GITHUB_ENV

  deploy_dev:
    needs: [detect, build_test]
    if: ${{ needs.detect.outputs.is_develop == 'true' && needs.detect.outputs.ids != '[]' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Configure kube
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
          kubectl get ns
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      - name: Deploy changed components to dev
        shell: bash
        run: |
          set -e
          comps='${{ needs.detect.outputs.components }}'
          for id in $(echo '${{ needs.detect.outputs.ids }}' | jq -r '.[]'); do
            comp=$(echo "$comps" | jq -r ".[] | select(.id==\"$id\")")
            chart=$(echo "$comp" | jq -r .chart)
            port=$(echo "$comp" | jq -r .port)
            release=$(echo "$id" | tr '/' '-')
            ns="app-dev"
            IMAGE_REPO="${{ env.IMAGE_REPO_PREFIX }}/${id}"
            DIGEST=$(grep "^${id}=" "$GITHUB_ENV" | cut -d= -f2)
            curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm upgrade --install "${release}" "${chart}" \
              --namespace "${ns}" --create-namespace \
              -f env/values-dev.yaml \
              --set app.name="${release}" \
              --set app.port="${port}" \
              --set image.repository="${IMAGE_REPO}" \
              --set image.digest="${DIGEST}"
            kubectl -n "${ns}" rollout status deploy/${release} --timeout=180s
          done

  deploy_staging:
    needs: [detect, build_test]
    if: ${{ needs.detect.outputs.is_main == 'true' && needs.detect.outputs.ids != '[]' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure kube
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
          kubectl get ns
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      - name: Deploy changed components to staging
        shell: bash
        run: |
          set -e
          comps='${{ needs.detect.outputs.components }}'
          for id in $(echo '${{ needs.detect.outputs.ids }}' | jq -r '.[]'); do
            comp=$(echo "$comps" | jq -r ".[] | select(.id==\"$id\")")
            chart=$(echo "$comp" | jq -r .chart)
            port=$(echo "$comp" | jq -r .port)
            release=$(echo "$id" | tr '/' '-')
            ns="app-staging"
            IMAGE_REPO="${{ env.IMAGE_REPO_PREFIX }}/${id}"
            DIGEST=$(grep "^${id}=" "$GITHUB_ENV" | cut -d= -f2 || true)
            curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm upgrade --install "${release}" "${chart}" \
              --namespace "${ns}" --create-namespace \
              -f env/values-staging.yaml \
              --set app.name="${release}" \
              --set app.port="${port}" \
              --set image.repository="${IMAGE_REPO}" \
              --set image.digest="${DIGEST}"
            kubectl -n "${ns}" rollout status deploy/${release} --timeout=180s
          done

  deploy_prod:
    needs: [detect]
    if: ${{ needs.detect.outputs.is_tag == 'true' && needs.detect.outputs.ids != '[]' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure kube
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
          kubectl get ns
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      - name: Deploy changed components to prod
        shell: bash
        run: |
          set -e
          comps='${{ needs.detect.outputs.components }}'
          for id in $(echo '${{ needs.detect.outputs.ids }}' | jq -r '.[]'); do
            comp=$(echo "$comps" | jq -r ".[] | select(.id==\"$id\")")
            chart=$(echo "$comp" | jq -r .chart)
            port=$(echo "$comp" | jq -r .port)
            release=$(echo "$id" | tr '/' '-')
            ns="app-prod"
            IMAGE_REPO="${{ env.IMAGE_REPO_PREFIX }}/${id}"
            # In a real setup, resolve digest from an artifact/registry mapping for the tag
            DIGEST=$(echo "${GITHUB_SHA}") # fallback; replace with your release mapping if needed
            curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm upgrade --install "${release}" "${chart}" \
              --namespace "${ns}" --create-namespace \
              -f env/values-prod.yaml \
              --set app.name="${release}" \
              --set app.port="${port}" \
              --set image.repository="${IMAGE_REPO}" \
              --set image.digest="${DIGEST}"
            kubectl -n "${ns}" rollout status deploy/${release} --timeout=180s
